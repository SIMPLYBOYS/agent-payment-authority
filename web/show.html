<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>APA 展示畫面</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body data-page="show">
<!-- The audience window (docs/commercial-gap2.md): the host page sends it
     the scene and what each customer's slot has read; it holds no token
     and calls no API. -->
<header class="show-top">
  <strong id="show-title">示範商店</strong>
  <span id="show-network" class="show-network">等待主持人頁</span>
</header>
<main class="show-main">
  <section class="show-stage">
    <div id="scene-zoom" class="zoom-controls"></div>
    <div class="show-frame scene-frame">
      <canvas id="unity-canvas" width="960" height="640" aria-label="Unity 商店場景"></canvas>
    </div>
    <p id="unity-status" class="show-unity" data-state="loading">場景載入中…</p>
    <div id="show-captions" class="show-captions" aria-live="polite"></div>
  </section>
  <div class="show-side">
    <aside id="show-customers" class="show-customers">
      <p class="show-wait">等待主持人頁：請在主持人頁按「開啟展示視窗」。</p>
    </aside>
    <div id="show-receipts" class="show-receipts"></div>
    <section id="show-checker" class="show-checker" aria-label="獨立驗證" hidden></section>
  </div>
  <section id="show-trust" class="show-trust" aria-label="為什麼可信"></section>
</main>
<script type="module" src="/ui/show.js"></script>
</body>
</html>
